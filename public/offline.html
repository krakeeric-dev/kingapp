<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#006B3F" />
    <title>KingApp Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8fbf9 0%, #eef6f1 100%);
        color: #102116;
        font-family: Arial, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 440px;
        width: 100%;
        border: 1px solid #d9fbe6;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 24px 80px rgba(15, 35, 24, 0.1);
        padding: 28px;
      }
      .logo {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        background: #006b3f;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 900;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: #52645a;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        background: #0f7338;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 16px;
        border-radius: 10px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">K</div>
      <h1>KingApp is offline</h1>
      <p>
        Your phone cannot reach the internet right now. Reconnect and return to
        KingApp to continue working with live data.
      </p>
      <a href="/login">Try again</a>
    </main>
  </body>
</html>
